name: Build and release
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching the version in VERSION
        required: true
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Build static executable and packages
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(cat VERSION)
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$REF_TYPE" = tag ]; then
            if [ "$TAG" != "v$version" ]; then
              printf 'Release tag %s does not match VERSION (expected v%s)\n' "$TAG" "$version" >&2
              exit 1
            fi
          fi
          docker build --target artifacts --output type=local,dest=dist .
          docker build --target filc-artifacts --output type=local,dest=dist-filc .
          mv dist/dirroof "dist/dirroof-${version}-linux-x86_64"
          mv dist-filc/dirroof-filc "dist-filc/dirroof-filc-${version}-linux-x86_64"
      - name: Test recursive eviction
        run: |
          for binary in dist/dirroof-*-linux-x86_64 dist-filc/dirroof-filc-*-linux-x86_64; do
            DIRROOF_BINARY="$binary" TMPDIR="$RUNNER_TEMP" python3 -m unittest discover -s tests
          done
      - name: Test Fil-C fanotify
        run: |
          work=$(mktemp -d "$RUNNER_TEMP/dirroof.XXXXXXXX")
          mkdir "$work/watch"
          head -c 32 /dev/zero > "$work/watch/old"
          touch -a -d @1 "$work/watch/old"
          dist-filc/dirroof-filc-*-linux-x86_64 -s 40 -vf "$work/watch" > "$work/log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat "$work/log"
            rm -rf "$work"
          }
          trap cleanup EXIT
          for attempt in {1..100}; do
            if grep -q 'tracking ' "$work/log"; then break; fi
            kill -0 "$pid"
            sleep 0.05
          done
          grep -q 'tracking ' "$work/log"
          head -c 32 /dev/zero > "$work/watch/new"
          for attempt in {1..100}; do
            if [ ! -e "$work/watch/old" ]; then break; fi
            kill -0 "$pid"
            sleep 0.05
          done
          test ! -e "$work/watch/old"
          test -s "$work/watch/new"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        with:
          name: release-assets
          path: |
            dist/dirroof-*-linux-x86_64
            dist/*.deb
            dist/*.rpm
            dist-filc/dirroof-filc-*-linux-x86_64
            dist-filc/*.deb
            dist-filc/*.rpm
            dist-filc/dirroof-filc-licenses.txt
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            "assets/dist/dirroof-${TAG#v}-linux-x86_64" assets/dist/*.deb assets/dist/*.rpm \
            "assets/dist-filc/dirroof-filc-${TAG#v}-linux-x86_64" assets/dist-filc/*.deb assets/dist-filc/*.rpm \
            assets/dist-filc/dirroof-filc-licenses.txt --clobber
